name: Pack & Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        # Strips the leading 'v' so tag v1.2.3 becomes version 1.2.3
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore Kafadanat.Contracts.sln

      - name: Build
        run: dotnet build Kafadanat.Contracts.sln -c Release --no-restore

      - name: Pack
        run: >
          dotnet pack Kafadanat.Contracts.csproj
          -c Release
          --no-build
          -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push "**/*.nupkg" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --source "https://nuget.pkg.github.com/ozcancaparoglu/index.json" \
            --skip-duplicate